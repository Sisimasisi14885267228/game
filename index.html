<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Камінь Ножиці Папір</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    color:white;
    padding:20px;
}

.container{
    width:100%;
    max-width:450px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,.4);
}

h1{
    margin-bottom:10px;
    font-size:32px;
}

.subtitle{
    opacity:.7;
    margin-bottom:25px;
}

.score-box{
    display:flex;
    justify-content:space-between;
    background:rgba(255,255,255,.08);
    padding:15px;
    border-radius:15px;
    margin-bottom:25px;
}

.score{
    font-size:22px;
    font-weight:bold;
}

.choices{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.choice{
    border:none;
    border-radius:20px;
    padding:18px;
    font-size:32px;
    cursor:pointer;
    transition:.2s;
    background:white;
}

.choice:hover{
    transform:scale(1.08);
}

.choice:active{
    transform:scale(.95);
}

.result{
    margin-top:25px;
    padding:20px;
    background:rgba(255,255,255,.08);
    border-radius:15px;
    min-height:120px;
}

.result h2{
    margin-bottom:10px;
}

.winner{
    color:#4ade80;
}

.loser{
    color:#f87171;
}

.draw{
    color:#facc15;
}
</style>
</head>
<body>

<div class="container">

    <h1>🎮 КНП</h1>
    <div class="subtitle">
        Камінь • Ножиці • Папір
    </div>

    <div class="score-box">
        <div>
            <div>Ти</div>
            <div class="score" id="userScore">0</div>
        </div>

        <div>
            <div>Бот</div>
            <div class="score" id="botScore">0</div>
        </div>
    </div>

    <div class="choices">
        <button class="choice" onclick="play('Камінь')">✊</button>
        <button class="choice" onclick="play('Ножиці')">✌️</button>
        <button class="choice" onclick="play('Папір')">✋</button>
    </div>

    <div class="result" id="result">
        <h2>Зроби свій вибір</h2>
        <p>Бот уже готується програти.</p>
    </div>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let userScore = 0;
let botScore = 0;

function play(userChoice){

    const choices = ["Камінь","Ножиці","Папір"];
    const botChoice = choices[Math.floor(Math.random()*3)];

    let result;
    let css;

    if(userChoice === botChoice){
        result = "🤝 Нічия";
        css = "draw";
    }
    else if(
        (userChoice==="Камінь" && botChoice==="Ножиці") ||
        (userChoice==="Ножиці" && botChoice==="Папір") ||
        (userChoice==="Папір" && botChoice==="Камінь")
    ){
        result = "🏆 Ти переміг!";
        css = "winner";
        userScore++;
    }
    else{
        result = "💀 Бот переміг";
        css = "loser";
        botScore++;
    }

    document.getElementById("userScore").textContent = userScore;
    document.getElementById("botScore").textContent = botScore;

    document.getElementById("result").innerHTML = `
        <h2 class="${css}">${result}</h2>
        <p><b>Ти:</b> ${userChoice}</p>
        <p><b>Бот:</b> ${botChoice}</p>
    `;

    if(tg.HapticFeedback){
        tg.HapticFeedback.impactOccurred("medium");
    }

    tg.sendData(JSON.stringify({
        user_choice:userChoice,
        bot_choice:botChoice,
        result:result,
        user_score:userScore,
        bot_score:botScore
    }));
}
</script>

</body>
</html>
